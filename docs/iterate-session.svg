<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Anatomy of one stage session</title>
<desc>The runner builds a Claude CLI argument list with optional model and effort values from the command, spawns it as a detached process group, and reads its JSON event stream line by line. Events are normalized into text, tool calls, a result, a session id, a resolved model, usage, errors, and completion.</desc>
<style>
  .box { fill: #F5F6F7; stroke: #BDC1C6; stroke-width: 1; }
  .teal { fill: #DAF0EC; stroke: #7FC4B8; stroke-width: 1; }
  .amber { fill: #FBEEDA; stroke: #DDB160; stroke-width: 1; }
  .blue { fill: #E6F1FB; stroke: #8AB4E0; stroke-width: 1; }
  .purple { fill: #EDE7F8; stroke: #A990DC; stroke-width: 1; }
  .red { fill: #FAE7E5; stroke: #DC9A92; stroke-width: 1; }
  .th { font-size: 14px; font-weight: 500; fill: #1A1C1E; }
  .ts { font-size: 12px; font-weight: 400; fill: #5E6368; }
  .arr { stroke: #8A8F94; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8F94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="teal" x="20" y="20" width="290" height="128" rx="8"/>
<text class="th" x="165" y="40" text-anchor="middle" dominant-baseline="central">The runner builds the command</text>
<text class="ts" x="165" y="62" text-anchor="middle" dominant-baseline="central">optional model and effort from CLI flags</text>
<text class="ts" x="165" y="80" text-anchor="middle" dominant-baseline="central">the stage name and the card id</text>
<text class="ts" x="165" y="98" text-anchor="middle" dominant-baseline="central">the unattended system prompt</text>
<text class="ts" x="165" y="116" text-anchor="middle" dominant-baseline="central">plus the dirty-tree note when the tree is not clean</text>
<text class="ts" x="165" y="134" text-anchor="middle" dominant-baseline="central">the session budget in dollars</text>

<line class="arr" x1="310" y1="84" x2="366" y2="84" marker-end="url(#arrow)"/>
<rect class="blue" x="366" y="20" width="374" height="128" rx="8"/>
<text class="th" x="553" y="40" text-anchor="middle" dominant-baseline="central">One Claude argument list</text>
<text class="ts" x="553" y="62" text-anchor="middle" dominant-baseline="central">the prompt is the slash command /stage card</text>
<text class="ts" x="553" y="80" text-anchor="middle" dominant-baseline="central">explicit model and effort pass through as arguments</text>
<text class="ts" x="553" y="98" text-anchor="middle" dominant-baseline="central">when omitted, the configured Claude defaults apply</text>
<text class="ts" x="553" y="116" text-anchor="middle" dominant-baseline="central">nothing goes through a shell, so no value is expanded</text>
<text class="ts" x="553" y="134" text-anchor="middle" dominant-baseline="central">the session budget remains a separate argument</text>

<line class="arr" x1="553" y1="148" x2="553" y2="182" marker-end="url(#arrow)"/>
<rect class="box" x="366" y="182" width="374" height="74" rx="8"/>
<text class="th" x="553" y="200" text-anchor="middle" dominant-baseline="central">Spawn, detached into its own process group</text>
<text class="ts" x="553" y="220" text-anchor="middle" dominant-baseline="central">stdout piped, stderr piped, cwd inherited</text>
<text class="ts" x="553" y="238" text-anchor="middle" dominant-baseline="central">the group is what gets signalled later</text>

<line class="arr" x1="553" y1="256" x2="553" y2="290" marker-end="url(#arrow)"/>
<rect class="box" x="366" y="290" width="374" height="74" rx="8"/>
<text class="th" x="553" y="308" text-anchor="middle" dominant-baseline="central">Read stdout, one JSON line at a time</text>
<text class="ts" x="553" y="328" text-anchor="middle" dominant-baseline="central">every line is appended to the raw event log</text>
<text class="ts" x="553" y="346" text-anchor="middle" dominant-baseline="central">each line resets the ten-minute silence timer</text>

<line class="arr" x1="366" y1="327" x2="310" y2="327" marker-end="url(#arrow)"/>
<rect class="purple" x="20" y="232" width="290" height="196" rx="8"/>
<text class="th" x="165" y="252" text-anchor="middle" dominant-baseline="central">Normalized into eight events</text>
<text class="ts" x="165" y="274" text-anchor="middle" dominant-baseline="central">text, printed to stderr when live</text>
<text class="ts" x="165" y="292" text-anchor="middle" dominant-baseline="central">tool call, printed to stderr when live</text>
<text class="ts" x="165" y="310" text-anchor="middle" dominant-baseline="central">result, held for stdout</text>
<text class="ts" x="165" y="328" text-anchor="middle" dominant-baseline="central">session id, printed at the close</text>
<text class="ts" x="165" y="346" text-anchor="middle" dominant-baseline="central">resolved model, retained in the report</text>
<text class="ts" x="165" y="364" text-anchor="middle" dominant-baseline="central">usage, turns and cost</text>
<text class="ts" x="165" y="382" text-anchor="middle" dominant-baseline="central">error, collected</text>
<text class="ts" x="165" y="400" text-anchor="middle" dominant-baseline="central">complete, the turn really ended</text>

<line class="arr" x1="553" y1="364" x2="553" y2="398" marker-end="url(#arrow)"/>
<rect class="red" x="366" y="398" width="374" height="92" rx="8"/>
<text class="th" x="553" y="418" text-anchor="middle" dominant-baseline="central">The session fails when</text>
<text class="ts" x="553" y="438" text-anchor="middle" dominant-baseline="central">the child exits non-zero, or any error event arrived</text>
<text class="ts" x="553" y="456" text-anchor="middle" dominant-baseline="central">or completion is missing, or the result is empty</text>
<text class="ts" x="553" y="474" text-anchor="middle" dominant-baseline="central">ten minutes of silence becomes such an error</text>

<path class="arr" d="M366 444 H338 V492 H310" marker-end="url(#arrow)"/>
<rect class="amber" x="20" y="454" width="290" height="92" rx="8"/>
<text class="th" x="165" y="476" text-anchor="middle" dominant-baseline="central">Shutdown, on failure or a signal</text>
<text class="ts" x="165" y="496" text-anchor="middle" dominant-baseline="central">SIGTERM or SIGINT to the whole group</text>
<text class="ts" x="165" y="514" text-anchor="middle" dominant-baseline="central">one second of grace</text>
<text class="ts" x="165" y="532" text-anchor="middle" dominant-baseline="central">then SIGKILL, so a descendant cannot survive</text>

<line class="arr" x1="553" y1="490" x2="553" y2="524" marker-end="url(#arrow)"/>
<rect class="teal" x="366" y="524" width="374" height="74" rx="8"/>
<text class="th" x="553" y="542" text-anchor="middle" dominant-baseline="central">On success, the runner takes over again</text>
<text class="ts" x="553" y="562" text-anchor="middle" dominant-baseline="central">the final reply goes to stdout</text>
<text class="ts" x="553" y="580" text-anchor="middle" dominant-baseline="central">turns, cost, and session id go to stderr</text>
</svg>
