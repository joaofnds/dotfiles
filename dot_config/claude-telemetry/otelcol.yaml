receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: otel
    username: otel
    password: otel
    create_schema: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [clickhouse]
